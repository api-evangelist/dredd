note: >-
  Dredd is a distributed command-line tool, not a hosted service, so the
  service-shaped halves of this artifact do not exist and are recorded as
  absent rather than guessed: there is no status page, no SLA, no uptime target
  and no runtime deprecation headers, because there is no runtime we operate
  against. What Dredd does publish is a versioning policy — and, since 2024, an
  unambiguous end-of-life signal in the form of an archived repository and an
  archived GitHub organization.
versioning:
  scheme: semver
  current: 14.1.0
  current_released: '2021-11-16'
  docs: https://dredd.org/en/latest/how-it-works/
  note: >-
    Published policy, quoted from the docs: "Dredd follows Semantic Versioning.
    To ensure certain stability of your Dredd installation (e.g. in CI), pin the
    version accordingly." Two npm dist-tags are documented as the stability
    contract — `npm install dredd` installs the latest published version
    including experimental pre-releases, and `npm install dredd@stable` skips
    them and is the recommendation for CI.
  user_agent_signal: >-
    Dredd sends its own version number in the User-Agent header of every HTTP
    request it makes, unless the API description document overrides that header.
deprecation:
