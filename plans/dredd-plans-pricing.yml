description: >-
  Dredd publishes no plans and no pricing, because there is nothing to charge
  for: it is an MIT-licensed command-line tool you install from npm, Docker Hub
  or a package manager and run on your own machine or CI runner. There is no
  hosted service, no account, no sign-up, no quota and no metering. This file
  records that as a measured zero, not as an unknown.
plans: []
note: >-
  SUPERSEDES A SCAFFOLD. Until this pass, this file carried invented
  freemium/pro tiers with a 1,000-requests-per-month quota, written by the
  2026-05-04 bulk sweep (method: generated) and never harvested from the
  provider. Dredd has no such tiers and never did. The scaffold is removed
  rather than corrected. Searched 2026-09-13: dredd.org has no /pricing page and
  no pricing section, and neither the README nor the docs mention a paid tier.
  The one commercial adjacency the docs DO name is the optional `apiary`
  reporter, which uploads test results to Apiary — Oracle's hosted API design
  service, a separate product that has since been shut down; it is not a Dredd
  plan and is not priced here.
