note: >-
  Dredd ships as a command-line tool plus a set of per-language "hooks handler"
  libraries — the glue an author writes test setup/teardown in. The first-party
  set is published by the apiaryio GitHub organization; the Go, Rust, PHP and
  Perl handlers are community implementations the Dredd docs link to but do not
  own, and are recorded here with official: false. EVERY first-party package's
  latest release predates 2022, the apiaryio org was marked archived by GitHub
  on 2024-11-08, and github.com/apiaryio/dredd itself is archived (read-only) —
  so the version/published fields below are the decay evidence, not a snapshot
  of an active release train.
