aid: dredd
name: Dredd
description: >-
  Dredd is a language-agnostic, MIT-licensed open source command-line tool that
  validates a running HTTP API against its own API description document. It
  compiles every request/response pair documented in an API Blueprint, OpenAPI
  2.0 or (experimentally) OpenAPI 3.0 file into an HTTP transaction, calls the
  API under test, and reports where the implementation and the documentation
  disagree. Hooks written in Node.js, Ruby, Python, PHP, Perl, Go or Rust handle
  per-transaction test setup and teardown, and pluggable reporters (xunit, dot,
  markdown, html) wire it into CI. Dredd publishes no API of its own — it is a
  client you install and run. The project has been archived and unmaintained
  since November 2024; the last release, 14.1.0, shipped in November 2021.
